<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A&amp;E Games" />
  <meta name="theme-color" content="#ffd9f1" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-ae.png" />
  <link rel="icon" type="image/png" href="./icon-ae-192.png" />
  <title>Sparkle Match</title>
</head>
<body data-theme="unicorn" data-screen="loading">
  <!-- the doors -->
  <main id="doors"></main>
  <button id="home" aria-label="All games (hold)">&#127968;</button>
  <button id="gear" aria-label="Grown-ups (hold)">&#9881;&#65039;</button>
  <!-- a door's map -->
  <main id="map"></main>
  <button id="mapBack" class="round back" aria-label="Doors"><i></i></button>
  <!-- a level -->
  <div id="stage"></div>
  <div id="ui">
    <div id="goal" aria-label="Goal"><div id="chips"></div><img id="friend" alt="" draggable="false"></div>
    <div id="boardbox"></div>
  </div>
  <button id="back" class="round back" aria-label="Map"><i></i></button>
  <button id="bulb" class="round" aria-label="Hint"><img src="./assets/match/light-bulb.webp" alt=""></button>
  <div id="intro" aria-hidden="true"></div>
  <div id="win" class="hidden">
    <div id="prize"></div>
    <img id="winFriend" alt="" draggable="false">
    <button id="next" aria-label="Next"><i></i></button>
  </div>
  <script type="module" src="/src/match/main.js"></script>
</body>
</html>
