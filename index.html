<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Games" />
  <meta name="theme-color" content="#7fd8ff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <title>Adalyn &amp; Esmae's Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; min-height: 100%; font-family: 'Fredoka', system-ui, sans-serif; color: #5a2a6b; background: linear-gradient(#9fe0ff, #ffe3f4); background-attachment: fixed; }
    main { min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 5vw 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
    h1 { margin: 0; text-align: center; font-size: clamp(30px, 7vw, 68px); line-height: 1.05; color: #fff; -webkit-text-stroke: 3px #7b3fa0; paint-order: stroke fill; text-shadow: 0 5px 0 #7b3fa0; }
    .games { display: flex; flex-wrap: wrap; gap: clamp(16px, 4vw, 44px); justify-content: center; width: 100%; }
    .game { width: min(86vw, 380px); text-decoration: none; color: inherit; background: #fff; border-radius: 34px; overflow: hidden; box-shadow: 0 10px 0 #0003; transition: transform .1s; }
    .game:active { transform: translateY(6px); box-shadow: 0 4px 0 #0003; }
    .art { height: clamp(130px, 24vh, 210px); display: flex; align-items: center; justify-content: center; font-size: clamp(60px, 12vh, 100px); }
    .candy .art { background: linear-gradient(135deg, #8fe3ff, #ffb3e6); }
    .uni .art { background: linear-gradient(135deg, #c9a8ff, #8fe3ff); }
    .mermaid .art { background: linear-gradient(135deg, #7ae0ff, #ffb8e0); }
    .princess .art { background: linear-gradient(135deg, #ffd6ea, #ffe9a0); }
    .label { padding: 14px 16px 18px; text-align: center; font-size: clamp(22px, 4vw, 32px); font-weight: 700; line-height: 1.1; }
    .label small { display: block; margin-top: 4px; font-size: .62em; font-weight: 500; color: #9b6bb0; }
  </style>
</head>
<body>
  <main>
    <h1>Adalyn &amp; Esmae's<br>Games</h1>
    <div class="games">
      <a class="game candy" href="./candy.html">
        <div class="art">&#127852;&#127846;&#127853;</div>
        <div class="label">Candy Adventure<small>Adalyn &amp; Esmae</small></div>
      </a>
      <a class="game uni" href="./uni.html">
        <div class="art">&#129412;&#127752;&#11088;</div>
        <div class="label">Uni's Blast Awesome Adventures<small>Addie &middot; unicorn forest</small></div>
      </a>
      <a class="game mermaid" href="./mermaid.html">
        <div class="art">&#129436;&#8205;&#9792;&#65039;&#128032;&#128150;</div>
        <div class="label">Mermaid Love Adventure<small>Esmae &middot; under the sea</small></div>
      </a>
      <a class="game princess" href="./princess.html">
        <div class="art">&#128081;&#127836;</div>
        <div class="label">Princess Kitchen<small>Esmae &middot; counting &amp; adding</small></div>
      </a>
    </div>
  </main>
  <script type="module" src="/src/hub.js"></script>
</body>
</html>
