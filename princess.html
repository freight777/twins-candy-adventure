<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A&amp;E Games" />
  <meta name="theme-color" content="#ffd1ec" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-ae.png" />
  <link rel="icon" type="image/png" href="./icon-ae-192.png" />
  <title>Princess Esmae's Royal Kitchen</title>
  <link rel="stylesheet" href="/src/princess/princess.css" />
</head>
<body>
  <div id="scene">
    <div id="wall"></div>
    <div id="floor"></div>
    <div id="staff"></div>
    <button id="home" aria-label="All games (hold)">&#127968;</button>
    <div id="stars" aria-label="Dishes served"><span class="sf"></span></div>
    <div id="princess"></div>
    <div id="wish" class="hidden"><div class="w-food"></div></div>
    <div id="table"><div id="tablesvg"></div><div id="plate"></div><div id="feast"></div></div>
    <div id="butler"><div class="b-body"></div><div class="b-food"></div></div>
    <div id="tony"><div class="b-body"></div></div>
    <div id="hearts"></div>
    <div id="again" class="hidden"><button id="again-yes" aria-label="Play again">&#128257;</button><a id="again-home" href="./" aria-label="All games">&#127968;</a></div>
    <div id="start"><div class="card">
      <div class="logo-small">Princess Esmae's</div><div class="logo-big">Royal Kitchen</div>
      <button id="go" aria-label="Play">&#9654;</button>
    </div></div>
  </div>
  <script type="module" src="/src/princess/princess.js"></script>
</body>
</html>
