<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A&amp;E Games" />
  <meta name="theme-color" content="#ffd1ec" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-ae.png" />
  <link rel="icon" type="image/png" href="./icon-ae-192.png" />
  <title>Princess Esmae's Royal Kitchen</title>
  <link rel="stylesheet" href="/src/princess/princess.css" />
</head>
<body>
  <div id="scene">
    <div id="wall"></div>
    <div id="floor"></div>
    <div id="staff"></div>
    <a id="home" href="./" aria-label="All games">&#127968;</a>
    <div id="stars"><span>&#11088;</span> <b id="starcount">0</b></div>
    <div id="princess"></div>
    <div id="table"><div id="tablesvg"></div><div id="plate"></div></div>
    <div id="butler"><div class="b-body"></div><div class="b-food"></div></div>
    <div id="hearts"></div>
    <div id="quiz" class="hidden">
      <div id="wish"><div class="w-food"></div><div class="w-text"></div></div>
      <div class="q-top"><div class="q-prompt"></div><button id="say" aria-label="Hear it again">&#128266;</button></div>
      <div class="q-choices"></div>
      <div class="q-msg"></div>
    </div>
    <div id="start"><div class="card">
      <div class="logo-small">Princess Esmae's</div><div class="logo-big">Royal Kitchen</div>
      <button id="go" aria-label="Play">&#9654;</button>
    </div></div>
  </div>
  <script type="module" src="/src/princess/princess.js"></script>
</body>
</html>
