<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A&amp;E Games" />
  <meta name="theme-color" content="#4ab8e8" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-ae.png" />
  <link rel="icon" type="image/png" href="./icon-ae-192.png" />
  <title>Mermaid Love Adventure</title>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading" class="loading"><div class="bouncer">&#129436;&#8205;&#9792;&#65039;</div><div class="l-text">Diving into the sea...</div><div class="bar"><i></i></div></div>

  <div id="ui">
    <div id="title" class="hidden">
      <div class="logo">
        <div class="logo-small">&#128150; Esmae's &#128150;</div>
        <div class="logo-big">Mermaid Love<br>Adventure</div>
      </div>
      <button id="play" aria-label="Play"><span>&#9654;</span></button>
    </div>

    <div id="hud" class="hidden">
      <button id="home" aria-label="All games (hold)">&#127968;</button>
      <div id="friends"></div>
      <div id="stars"><span>&#128150;</span> <span id="starcount">0</span></div>
      <div id="pearls" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- the speech bubble, deck, card, house title and banner are added by src/board/deck.js -->
  </div>
  <div id="fade"></div>

  <script type="module" src="/src/mermaid/game.js"></script>
</body>
</html>
