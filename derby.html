<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A&amp;E Games" />
  <meta name="theme-color" content="#14234a" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-ae.png" />
  <link rel="icon" type="image/png" href="./icon-ae-192.png" />
  <title>Tony's Home Run Derby</title>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading" class="loading"><div class="bouncer">&#9918;</div><div class="l-text">Getting the ballpark ready...</div><div class="bar"><i></i></div></div>

  <div id="ui">
    <div id="hud" class="hidden">
      <button id="home" aria-label="All games (hold)">&#127968;</button>
      <div id="hrbox">&#9918; <span id="hr">0</span> <small>home runs</small></div>
      <div id="ballsbox" aria-label="Pitches"><div id="balls"></div></div>
    </div>
    <div id="cue" class="hidden"></div>
    <div id="replay" class="hidden"><b>&#9679; REPLAY</b><small id="replayinfo"></small></div>
    <button id="replayBtn" class="hidden" aria-label="Watch the replay">&#128250;</button>
    <div id="bigtext" class="hidden"></div>
    <div id="tapL" class="tap"><span>&#11013;&#65039;</span></div>
    <div id="tapR" class="tap"><span>&#10145;&#65039;</span></div>

    <div id="title" class="hidden">
      <div class="logo"><div class="logo-small">&#127967; Tony's &#127967;</div><div class="logo-big">Home Run<br>Derby</div></div>
      <div class="title-bottom">
        <button id="play" aria-label="Play"><span>&#9654;</span></button>
        <div class="row"><button id="lbBtn" class="pill">&#127942; Leaderboard</button><button id="helper" class="pill">Helper arrows: ON</button><button id="gfx" class="pill">Graphics: Auto</button><button id="time" class="pill">Time: Night</button></div>
      </div>
    </div>

    <div id="over" class="hidden card">
      <h2>&#127881;</h2>
      <div class="big"><span id="final">0</span> <small>&#9918;</small></div>
      <div id="who"><button data-who="tony" aria-label="Tony">&#9918;</button><button data-who="adalyn" aria-label="Addie">&#129412;</button><button data-who="esmae" aria-label="Esmae">&#129500;&#8205;&#9792;&#65039;</button></div>
      <div id="boardmini"></div>
      <button id="again" class="pill green">&#8635; Play again</button>
    </div>
    <div id="board" class="hidden card"><h2>&#127942; Leaderboard</h2><div id="boardfull"></div><button id="closeBoard" class="pill">Close</button></div>
  </div>
  <script type="module" src="/src/derby/game.js"></script>
</body>
</html>
